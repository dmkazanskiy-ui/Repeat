# Repeat — Telegram Mini App (статика, SPA) на VPS 194.226.125.120.
# Кладётся в /etc/nginx/sites-available/repeat, HTTPS добавляет certbot --nginx.
server {
    server_name repeat.dm-kazanskiy.online;

    root /var/www/repeat;
    index index.html;
    charset utf-8;

    # index.html не кэшируем: иначе Telegram держит старую версию приложения.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Сборка Vite: имена с хэшем — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Сервер синхронизации (deploy/sync/server.py, systemd repeat-sync).
    # Лимиты по IP (зоны — в deploy/nginx-repeat-ratelimit.conf → conf.d).
    # Щедрые: у мобильных операторов много людей за одним IP.
    location /api/ {
        limit_req zone=repeat_api burst=40 nodelay;
        limit_conn repeat_conn 20;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 11m;
        client_body_timeout 20s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/repeat.dm-kazanskiy.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/repeat.dm-kazanskiy.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = repeat.dm-kazanskiy.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name repeat.dm-kazanskiy.online;
    return 404; # managed by Certbot


}