# Repeat — Telegram Mini App (статика, SPA) на VPS 194.226.125.120.
# Кладётся в /etc/nginx/sites-available/repeat, HTTPS добавляет certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name repeat.dm-kazanskiy.online;

    root /var/www/repeat;
    index index.html;
    charset utf-8;

    # index.html не кэшируем: иначе Telegram держит старую версию приложения.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Сборка Vite: имена с хэшем — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
